name: Mocked tests and package build

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Mocked contracts and package build (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Validate Dependabot configuration
        if: matrix.python == '3.14'
        run: uvx --from check-jsonschema==0.38.2 check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml
      - name: Run complete mocked test suite
        run: uv run pytest
      - name: Check configured mypy target and API compatibility (Python 3.8)
        if: matrix.python == '3.8'
        run: uv run --extra dev python checks/mypy_compatibility.py -v
      - name: Check configured mypy target and API compatibility (Python 3.13)
        if: matrix.python == '3.8'
        run: uv run --isolated --python 3.13 --extra dev python checks/mypy_compatibility.py -v
      - name: Build wheel and source distribution
        run: uv build
      - name: Require both package artifacts
        run: |
          foreach ($artifact in @("dist/installer_builder-1.6.0-py3-none-any.whl", "dist/installer_builder-1.6.0.tar.gz")) {
            if ((Get-Item -LiteralPath $artifact -ErrorAction Stop).Length -le 0) {
              throw "Empty package artifact: $artifact"
            }
          }
