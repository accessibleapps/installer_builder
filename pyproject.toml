[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "installer_builder"
version = "1.6.0"
authors = [
    {name = "Christopher Toth", email = "q@q-continuum.net"},
]
description = "Easily generate installers for multiple platforms"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8.6"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
]
dependencies = [
    "setuptools",
    "innosetup_builder @ git+https://github.com/accessibleapps/innosetup_builder.git",
    "py2exe; sys_platform == 'win32'",
    "pywin32; sys_platform == 'win32'",
    "py2app; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "mypy>=0.991,<1.15",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/q-continuum/installer_builder"
Issues = "https://github.com/q-continuum/installer_builder/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
python_version = "3.8"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = false
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["win32clipboard", "win32con", "win32api", "py2exe.*", "py2app.*", "innosetup_builder.*"]
ignore_missing_imports = true
